server {
    listen 80;
    server_name _;

    location /static/ {
        alias /usr/share/nginx/static/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /usr/share/nginx/media/;
        autoindex off;
    }

    location / {
        return 404;
    }
}
